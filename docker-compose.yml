services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: portfolio-backend
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-portfolio_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      DATABASE_NAME: ${POSTGRES_DB:-portfolio_db}
      JWT_SECRET: ${JWT_SECRET:-secret}
      NODE_ENV: production
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    command: /bin/sh -c "npm run seed:prod && npm run start:prod"

  # Angular Frontend (Served by internal Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: portfolio-frontend
    env_file:
      - .env
    ports:
      - "4200:4200" # Expose directly for Traefik/Homelab
    depends_on:
      - backend

  # Umami - self-hosted visitor analytics (countries, cities, referrers, devices, pages)
  # Dashboard: http://<server>:3001 (default login admin / umami - CHANGE IT). Expose via Traefik on its own subdomain.
  umami:
    image: ghcr.io/umami-software/umami:latest
    container_name: portfolio-umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?Set UMAMI_APP_SECRET in .env}
    depends_on:
      umami-db:
        condition: service_healthy
    init: true
    ports:
      - "3001:3000"

  # Separate DB so Umami never touches the portfolio data
  umami-db:
    image: postgres:16-alpine
    container_name: portfolio-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  umami_db_data:
