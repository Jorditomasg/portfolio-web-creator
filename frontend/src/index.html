<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Portfolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico?v=2" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/api/favicon.svg" sizes="any">
  <link rel="preload" href="fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Geist';
      font-weight: 100 900;
      font-display: fallback;
      src: url(/fonts/geist-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Geist';
      font-weight: 100 900;
      font-display: fallback;
      src: url(/fonts/geist-latin-ext.woff2) format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Geist Mono';
      font-weight: 100 900;
      font-display: fallback;
      src: url(/fonts/geist-mono-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Geist Mono';
      font-weight: 100 900;
      font-display: fallback;
      src: url(/fonts/geist-mono-latin-ext.woff2) format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    /* Fallbacks sized to Geist's metrics (measured on the site's text per weight) so the swap doesn't resize text. */
    @font-face {
      font-family: 'Geist Fallback';
      font-weight: 400;
      src: local('Arial'), local('ArialMT'), local('Liberation Sans');
      size-adjust: 104.38%; ascent-override: 96.28%; descent-override: 28.26%; line-gap-override: 0%;
    }
    @font-face {
      font-family: 'Geist Fallback';
      font-weight: 500;
      src: local('Arial'), local('ArialMT'), local('Liberation Sans');
      size-adjust: 106.73%; ascent-override: 94.17%; descent-override: 27.64%; line-gap-override: 0%;
    }
    @font-face {
      font-family: 'Geist Fallback';
      font-weight: 600 900;
      src: local('Arial Bold'), local('Arial-BoldMT'), local('Liberation Sans Bold');
      size-adjust: 101.75%; ascent-override: 98.77%; descent-override: 28.99%; line-gap-override: 0%;
    }
    @font-face {
      font-family: 'Geist Fallback Android';
      font-weight: 400;
      src: local('Roboto'), local('Roboto-Regular');
      size-adjust: 104.94%; ascent-override: 95.77%; descent-override: 28.11%; line-gap-override: 0%;
    }
    @font-face {
      font-family: 'Geist Fallback Android';
      font-weight: 500;
      src: local('Roboto'), local('Roboto-Regular');
      size-adjust: 107.30%; ascent-override: 93.66%; descent-override: 27.49%; line-gap-override: 0%;
    }
    @font-face {
      font-family: 'Geist Fallback Android';
      font-weight: 600 900;
      src: local('Roboto Bold'), local('Roboto-Bold');
      size-adjust: 107.98%; ascent-override: 93.07%; descent-override: 27.32%; line-gap-override: 0%;
    }
    @font-face {
      font-family: 'Geist Mono Fallback';
      font-weight: 100 900;
      src: local('Courier New'), local('CourierNewPSMT'), local('Liberation Mono'), local('Droid Sans Mono');
      size-adjust: 99.98%; ascent-override: 100.52%; descent-override: 29.5%; line-gap-override: 0%;
    }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
