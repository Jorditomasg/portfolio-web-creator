<header class="border-b border-line">
  <nav aria-label="Main" class="max-w-screen-xl mx-auto px-6 md:px-8 py-5 flex flex-wrap items-center justify-between gap-4">
    <a routerLink="/" class="font-mono text-[15px] font-medium tracking-tight text-ink">{{ contentService.siteTitle() }}</a>

    <ul class="flex flex-wrap items-center gap-1">
      @for (link of links; track link.path) {
        <li>
          <a [routerLink]="link.path" routerLinkActive="!text-ink font-medium border-primary" [routerLinkActiveOptions]="{ exact: link.path === '/' }"
             ariaCurrentWhenActive="page"
             class="inline-block px-3.5 py-3 text-[15px] text-ink-muted hover:text-ink border-b-2 border-transparent transition-colors">
            {{ link.label }}
          </a>
        </li>
      }
      @if (contentService.settings()?.show_admin_link) {
        <li>
          <a routerLink="/admin/login" class="inline-block px-3.5 py-3 font-mono text-[13px] text-ink-muted hover:text-ink">Admin</a>
        </li>
      }
    </ul>
  </nav>
</header>
