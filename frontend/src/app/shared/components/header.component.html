<header class="sticky top-0 z-40 border-b border-line bg-paper/85 backdrop-blur-md">
  <div class="max-w-screen-xl mx-auto px-6 md:px-8 h-16 flex items-center justify-between gap-4">
    <a routerLink="/" class="font-mono text-[15px] font-medium tracking-tight text-ink">{{ contentService.siteTitle() }}</a>

    <nav aria-label="Main" class="hidden md:block">
      <ul class="flex items-center gap-1">
        @for (link of links; track link.path) {
          <li>
            <a [routerLink]="link.path" routerLinkActive="!text-ink font-medium border-primary" [routerLinkActiveOptions]="{ exact: link.path === '/' }"
               ariaCurrentWhenActive="page"
               class="inline-flex items-center h-16 px-3.5 text-[15px] text-ink-muted hover:text-ink border-b-2 border-transparent transition-colors">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    @if (contentService.settings()?.show_admin_link) {
      <a routerLink="/admin/login" class="md:-mr-3.5 inline-flex items-center min-h-[44px] px-3.5 font-mono text-[13px] text-ink-muted hover:text-ink">Admin</a>
    }
  </div>
</header>

<nav aria-label="Main" class="md:hidden fixed inset-x-4 bottom-4 z-50 mx-auto max-w-sm rounded-full bg-ink/90 text-paper p-1.5 shadow-[0_8px_30px_rgb(0_0_0/0.25)] backdrop-blur-md">
  <ul class="grid grid-cols-4">
    @for (link of links; track link.path) {
      <li>
        <a [routerLink]="link.path" routerLinkActive="bg-paper !text-ink font-medium" [routerLinkActiveOptions]="{ exact: link.path === '/' }"
           ariaCurrentWhenActive="page"
           class="flex items-center justify-center min-h-[44px] rounded-full text-sm text-paper/75 transition-colors">
          {{ link.label }}
        </a>
      </li>
    }
  </ul>
</nav>
