<div>
  <div class="flex flex-wrap items-center justify-between gap-4 mb-8 sticky top-0 bg-paper/90 backdrop-blur z-20 py-4 border-b border-line px-6 md:px-10">
    <h1 class="text-2xl md:text-3xl font-semibold tracking-tight text-ink">About & hero</h1>
    <button (click)="save()" [disabled]="!isDirty() || isSaving()"
            class="px-6 py-2.5 bg-ink hover:bg-ink-soft disabled:opacity-50 disabled:cursor-not-allowed text-paper font-medium rounded-lg transition-all flex items-center justify-center gap-2 shadow-lg">
      @if (isSaving()) {
        <svg class="animate-spin h-5 w-5 text-paper" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Saving...
      } @else {
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>
        </svg>
        Save Changes
      }
    </button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 px-6 md:px-10 pb-10">
    <!-- About Section -->
    <div class="bg-surface rounded-lg border border-line p-6 h-fit">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-ink">Personal Information</h2>
        @if (isDirtyAbout()) {
          <span class="text-ink-muted text-sm animate-pulse">Modified</span>
        }
      </div>
      
      <div class="space-y-4">
        <div class="grid grid-cols-1 gap-4">
          <div>
            <label class="block text-sm text-ink-muted mb-1">Biography</label>
            <textarea [(ngModel)]="aboutForm.bio" name="bio" rows="6"
                      class="w-full px-4 py-2 bg-paper border border-line rounded-lg focus:border-ink outline-none text-ink resize-none transition-colors"
                      (ngModelChange)="checkDirtyAbout()"></textarea>
          </div>
        </div>
        <div class="grid grid-cols-1 gap-4">
          <div>
            <label class="block text-sm text-ink-muted mb-1">Highlights (one per line)</label>
            <textarea [(ngModel)]="aboutForm.highlightsText" name="highlights" rows="4"
                      class="w-full px-4 py-2 bg-paper border border-line rounded-lg focus:border-ink outline-none text-ink resize-none transition-colors"
                      placeholder="5+ years of experience&#10;International projects&#10;..."
                      (ngModelChange)="checkDirtyAbout()"></textarea>
          </div>
        </div>
        
      </div>
    </div>

    <!-- Hero Section -->
    <div class="bg-surface rounded-lg border border-line p-6 h-fit">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-ink">Hero Section</h2>
        @if (isDirtyHero()) {
          <span class="text-ink-muted text-sm animate-pulse">Modified</span>
        }
      </div>

      <div class="space-y-4">
        <div class="p-4 bg-paper rounded-lg border border-line mb-4">
          <p class="text-sm text-ink-muted mb-2">Title preview:</p>
          <p class="text-xl font-bold">
            <span class="text-ink">{{ heroForm.title || 'Title' }}</span>
            @if (heroForm.title_highlight) {
              <span class="text-ink"> {{ heroForm.title_highlight }}</span>
            }
          </p>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-ink-muted mb-1">Title</label>
            <input [(ngModel)]="heroForm.title" name="title"
                   class="w-full px-4 py-2 bg-paper border border-line rounded-lg focus:border-ink outline-none text-ink transition-colors"
                   placeholder="Full Stack Developer" (ngModelChange)="checkDirtyHero()">
          </div>
          <div>
            <label class="block text-sm text-ink-muted mb-1">Highlight</label>
            <input [(ngModel)]="heroForm.title_highlight" name="title_highlight"
                   class="w-full px-4 py-2 bg-paper border border-line rounded-lg focus:border-ink outline-none text-ink transition-colors"
                   placeholder="Angular specialist" (ngModelChange)="checkDirtyHero()">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-ink-muted mb-1">Subtitle</label>
            <input [(ngModel)]="heroForm.subtitle" name="subtitle"
                   class="w-full px-4 py-2 bg-paper border border-line rounded-lg focus:border-ink outline-none text-ink transition-colors" (ngModelChange)="checkDirtyHero()">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-ink-muted mb-1">Description</label>
            <textarea [(ngModel)]="heroForm.description" name="description" rows="3"
                      class="w-full px-4 py-2 bg-paper border border-line rounded-lg focus:border-ink outline-none text-ink resize-none transition-colors" (ngModelChange)="checkDirtyHero()"></textarea>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
