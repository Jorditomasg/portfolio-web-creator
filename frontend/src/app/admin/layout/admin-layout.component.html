<div class="min-h-screen md:h-screen flex flex-col md:flex-row bg-paper text-ink">
  <aside class="md:w-60 shrink-0 border-b md:border-b-0 md:border-r border-line bg-surface flex flex-col">
    <div class="h-14 md:h-16 px-5 flex items-center justify-between gap-3 border-b border-line">
      <a routerLink="/admin/dashboard" class="font-mono text-[14px] font-medium tracking-tight">{{ content.siteTitle() }}<span class="text-ink-muted"> / admin</span></a>
      <div class="flex items-center gap-1 md:hidden">
        <a routerLink="/" class="inline-flex items-center min-h-[44px] px-2 text-sm text-ink-muted hover:text-ink">Site</a>
        <button type="button" (click)="logout()" class="inline-flex items-center min-h-[44px] px-2 text-sm text-ink-muted hover:text-red-600">Log out</button>
      </div>
    </div>

    <nav aria-label="Admin" class="md:flex-1 overflow-x-auto md:overflow-y-auto md:py-4">
      <p class="hidden md:block px-5 pb-2 font-mono text-[11px] uppercase tracking-wider text-ink-muted">Content</p>
      <ul class="flex md:flex-col gap-1 px-3 py-2 md:py-0 w-max md:w-auto">
        @for (link of links; track link.path) {
          <li>
            <a [routerLink]="link.path" routerLinkActive="bg-stone !text-ink font-medium before:!bg-[var(--color-primary)]" ariaCurrentWhenActive="page"
               class="relative flex items-center min-h-[40px] px-3 rounded-md text-[14px] text-ink-muted hover:text-ink hover:bg-stone/60 transition-colors whitespace-nowrap
                      before:absolute before:left-0 before:top-2 before:bottom-2 before:w-[3px] before:rounded-full before:bg-transparent">
              {{ link.label }}
            </a>
          </li>
        }
        @if (content.settings()?.umami_url; as analyticsUrl) {
          <li>
            <a [href]="analyticsUrl" target="_blank" rel="noopener"
               class="flex items-center gap-1.5 min-h-[40px] px-3 rounded-md text-[14px] text-ink-muted hover:text-ink hover:bg-stone/60 transition-colors whitespace-nowrap">
              Analytics <span aria-hidden="true">↗</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="hidden md:flex flex-col gap-1 p-3 border-t border-line">
      <a routerLink="/" class="flex items-center gap-2 min-h-[40px] px-3 rounded-md text-[14px] text-ink-muted hover:text-ink hover:bg-stone/60 transition-colors">
        <span aria-hidden="true">←</span> View site
      </a>
      <button type="button" (click)="logout()" class="flex items-center min-h-[40px] px-3 rounded-md text-[14px] text-ink-muted hover:text-red-600 hover:bg-red-500/10 transition-colors text-left">
        Log out
      </button>
    </div>
  </aside>

  <main class="flex-1 md:overflow-y-auto relative">
    <router-outlet />
  </main>
</div>

<app-toast-container />
